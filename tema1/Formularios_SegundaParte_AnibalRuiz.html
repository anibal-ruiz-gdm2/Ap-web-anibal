<html>
    <head>

    </head>
    <boddy>
        <h1>Formularios</h1>

        <form action="anibal.ruiz1@educa.madrid.org" method="post">
            <fieldset>
                <legend>Personaje</legend>

                <label for="superheroe">Superhéroe favorito</label>
                <br>
                <input type="text" id="superheroe" name="superheroe"
                    list="superheroes" placeholder="Escribe o elige un superhéroe">

                <datalist id="superheroes">
                    <option value="Hulk">
                    <option value="Ironman">
                    <option value="Capitán América">
                    <option value="Spiderman">
                    <option value="Batman">
                    <option value="Superman">
                </datalist>

                <br>
                <br>

                <label>Color </label>
                <br>
                <input type="color" name="color"></input>

                <br>
                <br>

            </fieldset> 
       
            <fieldset>
                <legend>Datos de la persona</legend>
                <label>Nombre</label>
                  <br>
                <input type="text" id="Nombre" name="Nombre">
                <br>
                <br>

                <label>Telefono</label>
                  <br>

           
                <input type="tel" id="phone" name="phone"
                    pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"
                    maxlength="10"
                    minlength="10"
                    required>
                Formato 9999999

                <br>
                <br>
                <label>Fecha</label>
                  <br>
                <input type="date" id="Fecha" name="Fecha" required>
                
                <br>
                <br>
                <label>Contraseña</label>
                <br>
                <input type="password" name="password" id="contraseña">
            </fieldset>

                <br>
                <br>
            <fieldset>
                <legend>Selecciona forma de contacto preferida</legend>
                <input type="radio" id="Email" name="contacto">
                <label>Email</label>
                <input type="radio" id="Telefono" name="contacto">
                <label>Telefono</label>
                <input type="radio" id="Carta" name="contacto">
                <label>Carta</label>
            </fieldset>

            <br>
            <br>

            <fieldset>
                <input type="checkbox" id="Aplicaciones_web" name="asignaturA">
                <label>Aplicaciones web</label>
                <br>
                <input type="checkbox" id="Seguridad_Informatica" name="asignaturA">
                <label>Seguridad Informatica</label>
                <br>
                <input type="checkbox" id="PYTHON" name="asignaturA">
                <label>PYTHON</label>
             


            </fieldset>

            <br>
            <br>            
              
           
            <input type="submit" value="Enviar" 
                style="border-radius: 30px; padding: 6px 20px; cursor: pointer; background-color: rgb(82, 29, 29);color: aliceblue;">
            <input type="reset" value="Resetear" style="border-radius: 20px; padding: 6px 20px; cursor: pointer; color: aliceblue; background-color: rgb(218, 68, 68);">   
        </form>
    </boddy>
</html>
