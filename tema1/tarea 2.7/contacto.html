        <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #243247;
            background: #f3f6fa;
        }

        header, nav, main, footer {
            max-width: 1000px;
            margin: auto;
        }

        header {
            padding: 30px 24px;
            background: #17365d;
            color: white;
        }

        nav {

        }

        nav a {
            color: white;

            font-weight: bold;
        }

        main {
            padding: 24px;
        }

        section {
            background: white;
            padding: 22px;
            margin: 18px 0;
            border-radius: 10px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        figure {
            margin: 0;
        }

        figure img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 8px;
        }

        figcaption {
            font-size: .9rem;
            color: #526174;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccd5df;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #e7eef6;
        }

        footer {
            padding: 20px 24px;
            text-align: center;
            color: #526174;
        }
        </style>
